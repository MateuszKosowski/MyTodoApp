<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Mateusz Kosowski, Nikodem Nowak">
    <meta name="description" content="A simple TODO application">

    <link rel="icon" type="image/x-icon" href="./img/icons8-todo-list-flat-32.png">
    <link rel="stylesheet" type="text/css" href="theme.css">

    <!--BOOTSTRAP-->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <h1>MyNotes</h1>
    <div>
        <label>Search</label>
        <input type="text" id="inputSearch" placeholder="Type Your seach here..." />
    </div>
    <div class="todoListView">
        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Place</th>
                    <th>Category</th>
                    <th>Due date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody class="todoListBody">
                <!-- Todo items will be dynamically inserted here -->
            </tbody>
        </table>
    </div>
    <div class="todoFormView">
        <form>
            <label>Title</label>
            <input type="text" id="inputTitle" />
            <label>Description</label>
            <input type="text" id="inputDescription" />
            <label>Place</label>
            <input type="text" id="inputPlace" />
            <label>Category</label>
            <input type="text" id="inputCategory" />
            <label>Due date</label>
            <input type="date" id="inputDate" />
            <input type="button" value="Add new Task" onclick="addTodo()" />
        </form>
    </div>


</body>

<!-- Jeśli script jest w head to wykonuje się przed załadowaniem body -->
<script src="./script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

</html>
