<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Mateusz Kosowski, Nikodem Nowak">
    <meta name="description" content="A simple TODO application">

    <link rel="icon" type="image/x-icon" href="./img/icons8-todo-list-flat-32.png">
    <link rel="stylesheet" type="text/css" href="theme.css">

    <title>MyNotes - Todo Application</title>

    <!--BOOTSTRAP-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
    <div class="container py-5">
        <!-- Header -->
        <div class="text-center mb-5">
            <h1 class="display-4 fw-bold text-primary">
                <i class="bi bi-list-check"></i> MyNotes
            </h1>
            <p class="text-muted">Manage your tasks efficiently</p>
        </div>

        <!-- Search Box -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="input-group">
                    <span class="input-group-text bg-primary text-white">
                        <i class="bi bi-search"></i>
                    </span>
                    <input type="text" id="inputSearch" class="form-control form-control-lg" 
                           placeholder="Search tasks by title or description..." />
                </div>
            </div>
        </div>

        <!-- Filter Box -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
            <div class="row g-3">
                <div class="col-md-6">
                <label for="filterFromDate" class="form-label fw-bold">From Date</label>
                <input type="date" id="filterFromDate" class="form-control" />
                </div>
                <div class="col-md-6">
                <label for="filterToDate" class="form-label fw-bold">To Date</label>
                <input type="date" id="filterToDate" class="form-control" />
                </div>
            </div>
            </div>
        </div>

        <!-- Todo List -->
        <div class="todoListView card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">📋 Your Tasks</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Title</th>
                                <th>Description</th>
                                <th>Place</th>
                                <th>Category</th>
                                <th>Due Date</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="todoListBody">
                            <!-- Todo items will be dynamically inserted here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Add Task Form -->
        <div class="todoFormView card shadow-sm">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0">➕ Add New Task</h5>
            </div>
            <div class="card-body">
                <form>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="inputTitle" class="form-label fw-bold">Title</label>
                            <input type="text" id="inputTitle" class="form-control" 
                                   placeholder="Enter task title" required />
                        </div>
                        <div class="col-md-4">
                            <label for="inputPlace" class="form-label fw-bold">Place</label>
                            <input type="text" id="inputPlace" class="form-control" 
                                   placeholder="Location" />
                        </div>
                        <div class="col-md-4">
                            <label for="inputDate" class="form-label fw-bold">Due Date</label>
                            <input type="date" id="inputDate" class="form-control" required />
                        </div>
                        <div class="col-md-12">
                            <label for="inputDescription" class="form-label fw-bold">Description</label>
                            <textarea id="inputDescription" class="form-control" rows="3"
                                      placeholder="Enter task description"></textarea>
                        </div>
                        <div class="col-12">
                            <button type="button" class="btn btn-success btn-lg w-100" onclick="addTodo()">
                                <i class="bi bi-plus-circle"></i> Add New Task
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>

<!-- Jeśli script jest w head to wykonuje się przed załadowaniem body -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<script src="./script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

</html>
