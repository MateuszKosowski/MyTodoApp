<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Mateusz Kosowski, Nikodem Nowak">
    <meta name="description" content="A simple TODO application">

    <link rel="icon" type="image/x-icon" href="./img/icons8-todo-list-flat-32.png">
    <link rel="stylesheet" type="text/css" href="theme.css">
    <title>MyTODO App</title>
</head>

<body>
    <h1>MyNotes</h1>
    <div class="todoListView"></div>
    <div class="todoFormView">
        <form>
            <label>Title</label>
            <input type="text" id="inputTitle" />
            <label>Description</label>
            <input type="text" id="inputDescription" />
            <label>Place</label>
            <input type="text" id="inputPlace" />
            <label>Category</label>
            <input type="text" id="inputCategory" />
            <label>Due date</label>
            <input type="date" id="inputDate" />
            <input type="button" value="Add new Task" onclick="addTodo()" />
        </form>
    </div>


</body>

<!-- Jeśli script jest w head to wykonuje się przed załadowaniem body -->
<script src="./script.js"></script>

</html>
